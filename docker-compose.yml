services:
    db:
        image: postgres:17-alpine
        container_name: restaurant_postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: restaurant_db
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: password
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data

volumes:
    pgdata:
