<!-- frontend/src/app/app.html -->
<div class="layout">
  <header class="navbar">
    <div class="brand">
      @if (settingsService.config()?.logo; as logo) {
        <img [src]="logo" alt="Logo" class="navbar-logo" />
      }
      <h1>{{ config()?.name }}</h1>
    </div>

    <a routerLink="/">
      <img src="icons/home.svg" alt="home" class="icon" />
    </a>
  </header>

  <main class="content">
    <router-outlet />
  </main>
</div>
