<!-- frontend/src/app/app.html -->
<div class="layout">
  <header class="navbar">
    <a routerLink="/" title="Torna alla Home" class="brand">
      @if (settingsService.config()?.logo; as logo) {
        <img [src]="logo" alt="Logo" class="navbar-logo" />
      }
      <h1>{{ config()?.name }}</h1>
    </a>

    <a routerLink="/settings" title="Impostazioni">
      <img src="icons/settings.svg" alt="Impostazioni" class="icon" />
    </a>
  </header>

  <main class="content">
    <router-outlet />
  </main>
</div>
