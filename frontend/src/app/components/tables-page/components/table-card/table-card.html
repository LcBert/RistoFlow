<a [routerLink]="cardRoute()" class="table-card" [attr.aria-label]="'Tavolo ' + cardNumber()">
  <div class="card-body" [class]="'status-' + statusCode()">
    <div class="card-top">
      @if (cardSeats(); as seats) {
        <span class="seats-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          {{ seats }}
        </span>
      } @else {
        <span class="status-dot"></span>
      }
    </div>

    <div class="table-main">
      <span class="table-label">Tavolo</span>
      <h3 class="table-number">{{ cardNumber() }}</h3>
    </div>

    <div class="card-bottom">
      <span class="status-pill">{{ cardStatus() }}</span>
    </div>
  </div>
</a>
