<section class="tables-page-component">
  <div class="header-actions">
    <button type="button" class="btn-action" (click)="isAddModalOpen.set(true)">
      ➕ Aggiungi Tavolo
    </button>
  </div>

  <div class="tables-container">
    @for (table of allTables(); track table.number) {
      <app-table-card [table]="table" />
    }
  </div>

  @if (isAddModalOpen()) {
    <app-table-add (close)="isAddModalOpen.set(false)" />
  }
</section>
