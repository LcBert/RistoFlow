<a [routerLink]="cardRoute()" class="card-link">
  @if (cardIcon()) {
    <div class="card-icon-panel" aria-hidden="true">
      <span class="card-icon">{{ cardIcon() }}</span>
    </div>
  }
  <div class="card-body">
    <h3>{{ cardTitle() }}</h3>
    <p>{{ cardDescription() }}</p>
  </div>
  <div class="card-arrow-panel" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12h14M12 5l7 7-7 7"/>
    </svg>
  </div>
</a>
