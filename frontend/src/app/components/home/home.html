<section class="home-container">
  <aside class="sidebar">
    <div class="sidebar-actions">
      @for (action of actions; track action.route) {
        <app-action-card [action]="action" />
      }
    </div>
  </aside>

  <main class="main-content">
    <div class="welcome-banner">
      <h2>Benvenuto nel Gestionale Ristorante</h2>
      <p>Seleziona una sezione dalla barra laterale per iniziare.</p>
    </div>
    @if (tablesService.loading()) {
      <p class="loading-label">Caricamento tavoli...</p>
    } @else {
      @for (table of tablesService.tables(); track table.number) {
        <div class="tables-container">
          <app-table-card [table]="table" />
        </div>
      }
    }
  </main>
</section>
