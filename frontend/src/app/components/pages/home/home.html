<section class="home-container">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h3 class="sidebar-title">Accesso Rapido</h3>
    </div>
    <div class="sidebar-actions">
      @for (action of actions; track action.route) {
        <app-action-card [action]="action" />
      }
    </div>
  </aside>

  <main class="main-content">
    <section class="modules-section">
      <div class="section-title">
        <h3>Moduli Principali</h3>
        <p>Tutti gli strumenti a portata di mano</p>
      </div>

      <div class="modules-grid">
        @for (mod of modules; track mod.route) {
          <app-home-module [module]="mod" />
        }
      </div>
    </section>
  </main>
</section>
