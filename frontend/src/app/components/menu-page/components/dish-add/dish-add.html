<div class="modal-backdrop" (click)="onCancel()">
  <div class="card-form" (click)="$event.stopPropagation()">
    <h2>Crea nuovo piatto</h2>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="dish-category">Categoria</label>
        <select id="dish-category" formControlName="category">
          <option value="" disabled selected>-- Scegli una categoria --</option>
          @for (c of allCategories(); track c.id) {
            <option [value]="c.id">{{ c.name }}</option>
          }
        </select>
      </div>

      <div class="form-group">
        <label for="dish-name">Nome piatto</label>
        <input type="text" id="dish-name" formControlName="name" placeholder="Es. Margherita" />
      </div>

      <div class="form-group">
        <label for="dish-price">Prezzo (€)</label>
        <input type="number" id="dish-price" formControlName="price" step="0.01" min="0" placeholder="0.00" />
      </div>

      <div class="form-group">
        <label for="dish-description">Descrizione</label>
        <input type="text" id="dish-description" formControlName="description" placeholder="Ingredienti, dettagli..." />
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-primary" [disabled]="form.invalid">Aggiungi Piatto</button>
        <button type="button" class="btn-secondary" (click)="onCancel()">Annulla</button>
      </div>
    </form>
  </div>
</div>
